name: task6-data
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: faker
      POSTGRES_USER: faker
      POSTGRES_PASSWORD: faker
    ports:
      - "127.0.0.1:${DB_PORT:-55436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faker -d faker"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://faker:faker@db:5432/faker
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
      - "127.0.0.1:${WEB_PORT:-3000}:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

